<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiramisu AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
      background: #fdf6e3;
      text-align: center;
      color: #5a3a2a;
    }
    h1 {
      color: #c25a3e;
      font-size: 28px;
      padding: 20px 20px 0;
      margin: 0;
    }
    .hint {
      color: #888;
      font-size: 15px;
      padding: 10px 30px;
      line-height: 1.5;
    }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: #fdf6e3;
    }
    .ar-button {
      background: #c25a3e;
      color: white;
      padding: 16px 36px;
      border-radius: 30px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(194, 90, 62, 0.3);
    }
    .credit {
      font-size: 11px;
      color: #aaa;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>🍰 Tiramisu</h1>
  <p class="hint">Today's special — Tap to see it on your table</p>

  <model-viewer
    src="tiramisu.glb"
    ios-src="Tiramisu.usdz"
    alt="A delicious tiramisu"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    auto-rotate
    shadow-intensity="1">

    <button slot="ar-button" class="ar-button">
      👀 View in AR
    </button>
  </model-viewer>

  <p class="credit">3D model: "Tiramisu" by Ronen, CC BY-ND (Sketchfab)</p>
</body>
</html>
